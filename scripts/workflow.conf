# 工作流的机械阈值与路径表。scripts/validate_docs.py 和 scripts/hooks/commit-msg 读取本文件。
# 规则写在 AGENTS.md；本文件只放数字和路径，内核不重复这些数字。
# 格式：每行「键 值」，# 开头为注释。

# AGENTS.md 字数上限（按字符计，不是字节）。2026-10-23 同步模板后为 7,364 字，此后只降不升。
# 超了先删，或把按时机执行的步骤移进 docs/howto/。
kernel-max-chars 7400

# 同时 active 的单元上限（校验器 active-units）。并行组试行：一组 3 个并行单元 + 1 个集成单元，
# 见 docs/howto/parallel.md。试行结束不再并行时改回 3。
active-units-max 4

# 硬线路径：提交改到这些路径时，提交信息必须有一行「硬线：<动了什么>」（AGENTS.md 第 3 节）。
# 一行一个 shell 通配模式，按 git 暂存区路径（相对仓库根，正斜杠）匹配；* 可跨目录。
# 契约与认证结构按 AGENTS.md 第 8 节保护；变更提交信息须写「硬线：」。
hardline packages/shared/src/contract/*
hardline apps/api/drizzle/*
hardline apps/api/src/auth.ts
hardline apps/api/src/db/schema.ts
