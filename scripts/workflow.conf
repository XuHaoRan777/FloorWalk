# 工作流的机械阈值与路径表。scripts/validate_docs.py 和 scripts/hooks/commit-msg 读取本文件。
# 规则写在 AGENTS.md；本文件只放数字和路径，内核不重复这些数字。
# 格式：每行「键 值」，# 开头为注释。

# AGENTS.md 字数上限（按字符计，不是字节）。2026-11-04 随模板改为 8500（原 7400，用户原话"也改8500"）；
# 上限防的是内核只增不减，不是 token 成本；调高只由用户决定。超了先删，或把按时机执行的步骤移进 docs/howto/。
kernel-max-chars 8500

# 同时 active 的单元上限（校验器 active-units）。并行组试行时改为 4（3 个并行单元 + 1 个集成单元，
# 见 docs/howto/parallel.md）；g01 已于 2026-10-25 收组，改回 3；2026-10-29 g02 开组改为 4，收组已改回 3；2026-11-03 g03 批准时改为 8（7 个单元加 1），收组后恢复为 3；2026-11-09 接力线一（FW-024～FW-029）批准时改为 6（用户原话"同意"），原值 3，线一归档后改回。
active-units-max 6

# 硬线路径：提交改到这些路径时，提交信息必须有一行「硬线：<动了什么>」（AGENTS.md 第 3 节）。
# 一行一个 shell 通配模式，按 git 暂存区路径（相对仓库根，正斜杠）匹配；* 可跨目录。
# 契约与认证结构按 AGENTS.md 第 8 节保护；变更提交信息须写「硬线：」。
hardline packages/shared/src/contract/*
hardline apps/api/drizzle/*
hardline apps/api/src/auth.ts
hardline apps/api/src/db/schema.ts

# 跨单元引用 AC（校验器 cross-unit-ac）：只查未归档、在这一天及以后批准或尚未批准的 spec。
# 复制模板时写当天；之前批准的单元不追溯。
cross-unit-ac-since 2026-11-07

# 配置键契约（校验器 env-attr / env-dead-key / env-missing-key，见 docs/context/dev-environment.md「配置」）。
# env-group <模板> <引用 glob>...：每个子项目一行；引用文件里的 ${K}、{$K}、os.environ、Settings 字段、
# import.meta.env / process.env / env.K 都算读到；以 } 直接结束的占位符和无默认值的 Settings 字段算必填。
# env-group <子项目>/.env.example <子项目>/src/**/*.yml <子项目>/**/config.py
# env-ignore <键>：框架自己读、代码里看不到的键（如 SPRING_PROFILES_ACTIVE），一行一个。
# env-local <本地文件> <模板>：--env-keys 默认查「模板去掉 .example」，不是这个位置时才写。
# env-untracked on：.env*（*.example 除外）被 Git 跟踪即报错；有意提交 .env 的项目不开。

# 本次同步只覆盖工作流文档与脚本；各端模板属性对账后再登记 env-group。
env-untracked on
